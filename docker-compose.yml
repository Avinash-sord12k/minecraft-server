services:
  mc:
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    network_mode: "host"
    ports:
      - "25565:25565"
      - "24454:24454/udp"
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      VIEW_DISTANCE: "10"
      MAX_TICK_TIME: "-1"
      VERSION: "1.20.1"
      TYPE: FORGE
      FORGE_VERSION: "47.3.0"
      WORLD: "/worlds/world"
      FORCE_WORLD_COPY: "false"
      ICON: "/extras/server-icon.png"
      CF_API_KEY: ${CF_API_KEY}
      CURSEFORGE_FILES: "@/extras/cf-mods.txt"
      RCON_ENABLE: "true"
      RCON_PASSWORD: "4e0eb55bdfcd63cfd7f8f770"
      RCON_CMDS_LAST_DISCONNECT: /save-all
    volumes:
      - ./scripts:/scripts  # Mount the scripts directory
      - ./world:/worlds/world
      - ./data:/data
      # - ./data/mc-mods/:/mods
      - ./backups:/backups
      - ./extras:/extras
